# Teach Llama-3.2-3B-Instruct (general assistant) to be a coding assistant.
# Base is NOT a code model — that's the point. Pair with a coding dataset in `chat` schema
# (e.g. the built-in CodeAlpaca or Magicoder-Evol catalog entries).
#
# Expected outcome on M-series w/ 16 GB: ~5-15 tok/s training, ~40 min for 600 iters.
# Resulting model writes idiomatic Python, JS, Rust on most prompts; weaker on niche langs.
model: "mlx-community/Llama-3.2-3B-Instruct-4bit"
train: true
fine_tune_type: lora
seed: 0
batch_size: 4
iters: 600
learning_rate: 2.0e-5
num_layers: 16
grad_accumulation_steps: 1
max_seq_length: 2048
val_batches: 25
steps_per_report: 10
steps_per_eval: 75
save_every: 150
grad_checkpoint: false
mask_prompt: true
optimizer: adamw
lora_parameters:
  keys: ["self_attn.q_proj", "self_attn.k_proj", "self_attn.v_proj", "self_attn.o_proj"]
  rank: 8
  scale: 16.0
  dropout: 0.05
