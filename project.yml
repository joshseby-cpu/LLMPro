name: MLXStudio
options:
  bundleIdPrefix: com.josh.mlxstudio
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SUPPORTED_PLATFORMS: "macosx"
    ARCHS: "arm64"
    ONLY_ACTIVE_ARCH: YES
    SUPPORTS_MACCATALYST: NO
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  MLXStudio:
    type: application
    platform: macOS
    sources:
      - path: MLXStudio
        excludes:
          - "Resources/uv-aarch64-apple-darwin"
      - path: MLXStudio/Resources/uv-aarch64-apple-darwin
        type: file
        optional: true
    info:
      path: MLXStudio/Info.plist
      properties:
        CFBundleDisplayName: MLX Studio
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundleIconName: AppIcon
        CFBundleIconFile: AppIcon
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHighResolutionCapable: true
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
    entitlements:
      path: MLXStudio/MLXStudio.entitlements
      properties:
        com.apple.security.cs.allow-jit: true
        com.apple.security.cs.allow-unsigned-executable-memory: true
        com.apple.security.cs.disable-library-validation: true
        com.apple.security.cs.allow-dyld-environment-variables: true
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.josh.mlxstudio.MLXStudio
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MLXStudioTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/MLXStudioTests
    dependencies:
      - target: MLXStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.josh.mlxstudio.MLXStudioTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MLXStudio:
    build:
      targets:
        MLXStudio: all
        MLXStudioTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MLXStudioTests
    profile:
      config: Release
    archive:
      config: Release
